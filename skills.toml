[defaults]
init_release = true
package_formats = [
  "tar.gz",
]
package_allowlist = [
  "SKILL.md",
  "agents/",
  "config/",
  "references/",
  "scripts/",
  "assets/",
]
required_files = [
  "SKILL.md",
  "agents/openai.yaml",
]
sync_exclude_globs = [
  ".DS_Store",
  "**/.DS_Store",
  "*.local.*",
  "**/*.local.*",
  "*.local.json",
  "**/*.local.json",
  "__pycache__/*",
  "**/__pycache__/*",
  "*.pyc",
  "**/*.pyc",
]
forbidden_package_globs = [
  ".DS_Store",
  "**/.DS_Store",
  "*.local.*",
  "**/*.local.*",
  "*.local.json",
  "**/*.local.json",
  "*.test.md",
  "*.filtered-test.md",
  "*.skill-test.md",
  "regression_*.py",
  "**/regression_*.py",
  "codex-session-report-*.md",
  "codex-daily-submit-*.md",
  "codex-weekly-submit-*.md",
  "codex-weekly-plan-*.md",
  "codex-monthly-submit-*.md",
  "__pycache__/*",
  "**/__pycache__/*",
  "*.pyc",
]
forbidden_init_patterns = [
  "codex-session-report-[0-9]{4}-[0-9]{2}-[0-9]{2}",
  "codex-daily-submit-[0-9]{4}-[0-9]{2}",
  "filtered-test",
  "skill-test",
  "测试输出今天的日报",
  "测试今日的",
  "脚本需要写进skill",
  "日报总结的skill",
  "/Users/[^/[:space:]`]+/",
]

